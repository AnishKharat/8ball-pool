<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1316">
<title>Chalkline</title>
<style>
  :root {
    --bg: #0e1316; --panel: #161e22; --panel-2: #1d282d; --line: #2c3a40; --text: #e9e6dc; --muted: #93a2a6;
    --chalk: #7cc6e8; --brass: #d9a441; --warn: #ffb35c; --ok: #6fd39a; --bad: #ef6f5e;
    --gut: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(120% 80% at 50% 0%, #17252b 0%, var(--bg) 60%); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  button, select {
    min-height: 44px; padding: 8px 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #45585f; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--chalk); color: #0b1a22; border-color: var(--chalk); font-weight: 650; }
  :focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* No scrolling, zooming, text selection or long-press callouts while playing. */
  #game {
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
    height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
    padding: max(8px, env(safe-area-inset-top)) max(var(--gut), env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(var(--gut), env(safe-area-inset-left));
  }

  /* HUD: two team cards with the turn and shot clock between them. */
  .hud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
  .team { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; min-width: 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; transition: border-color .2s, box-shadow .2s; }
  .team.r { flex-direction: row-reverse; }
  .team.active { border-color: var(--chalk); box-shadow: 0 0 0 1px var(--chalk), 0 0 18px rgba(124,198,232,.18); }
  .players { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .team.r .players { align-items: flex-end; }
  .pl { display: flex; gap: 6px; align-items: center; min-width: 0; font-weight: 600; white-space: nowrap; }
  .pl span { overflow: hidden; text-overflow: ellipsis; }
  .pl.up { color: var(--chalk); }
  .pl.up::before { content: "\25B8"; }
  .pl.off { color: var(--muted); font-weight: 400; }
  .pl.off::after { content: "away"; font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; }
  .grp { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; min-width: 0; }
  .team.r .grp { align-items: flex-start; }
  .glabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .chips { display: flex; gap: 2px; flex-wrap: wrap; }
  .turn { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; }
  .clock { position: relative; width: 44px; height: 44px; }

  /* Free-for-all scoreboard: one cell per player, in shooting order, before the clock. */
  .hud.ffa { grid-template-columns: minmax(0, 1fr) auto; }
  .scores { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; min-width: 0; }
  .sc { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 6px; align-items: center;
    padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .sc .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; }
  .sc b { grid-row: 1 / 3; grid-column: 2; font-size: 22px; font-variant-numeric: tabular-nums; }
  .sc .st8 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; min-height: 1.2em; }
  .sc.up { border-color: var(--chalk); box-shadow: 0 0 0 1px var(--chalk); }
  .sc.up .nm { color: var(--chalk); }
  .sc.up .nm::before { content: "\25B8 "; }
  .sc.lead b, .sc.lead .st8 { color: var(--brass); }
  .sc.off { opacity: .55; }
  .clock svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .clock circle { fill: none; stroke-width: 4; }
  .clock .track { stroke: var(--line); }
  .clock .arc { stroke: var(--chalk); stroke-linecap: round; transition: stroke .3s; }
  .clock.low .arc { stroke: var(--bad); }
  .clock b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }

  /* Mini balls: stripes show a white cap pattern, so the two groups differ by more than colour. */
  .chip {
    --c: #888; width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font: 700 9px/1 system-ui, sans-serif; color: #15171a; background: var(--c);
    box-shadow: inset -2px -3px 4px rgba(0,0,0,.35), inset 2px 2px 3px rgba(255,255,255,.35);
  }
  .chip.st { background: linear-gradient(#f4efe2 0 24%, var(--c) 24% 76%, #f4efe2 76%); }
  .chip.cap { background: linear-gradient(var(--c) 0 26%, #f4efe2 26% 74%, var(--c) 74%); }
  .chip i { font-style: normal; width: 11px; height: 11px; border-radius: 50%; background: #f4efe2; display: grid; place-items: center; }
  .chip.gone { opacity: .22; }

  .arena { min-height: 0; display: grid; gap: 10px; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "hit table power"; align-items: center; }
  .tableWrap { grid-area: table; position: relative; width: 100%; height: 100%; min-width: 0; min-height: 0; }
  #table { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ctl.hit { grid-area: hit; }
  .ctl.pow { grid-area: power; height: 100%; justify-content: center; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  #hit {
    position: relative; width: 104px; height: 104px; border-radius: 50%; touch-action: none; cursor: pointer;
    background: radial-gradient(circle at 36% 30%, #fffdf6 0%, #ece7d8 45%, #b3ad9c 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  #hit::before, #hit::after { content: ""; position: absolute; background: rgba(0,0,0,.12); }
  #hit::before { left: 50%; top: 8%; bottom: 8%; width: 1px; }
  #hit::after { top: 50%; left: 8%; right: 8%; height: 1px; }
  #hitLimit { position: absolute; inset: 25%; border: 1px dashed rgba(0,0,0,.3); border-radius: 50%; pointer-events: none; }
  #hitDot { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #3d7fb0; box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,.5); pointer-events: none; }
  .fine { display: flex; gap: 8px; }
  .fine button { touch-action: none; min-width: 48px; }
  #power {
    position: relative; width: 52px; height: min(300px, 70%); min-height: 120px; border-radius: 26px; touch-action: none; cursor: grab; overflow: hidden;
    background: linear-gradient(90deg, #11181b, #1f2a2f 50%, #11181b); border: 1px solid var(--line);
  }
  #powerFill {
    position: absolute; left: 0; right: 0; top: 0; height: calc(var(--p, 0) * 100%);
    background: linear-gradient(var(--chalk), var(--brass) 60%, var(--bad));
  }
  #power::after { content: "pull"; position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }

  .bottom { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 44px; }
  .msg { min-width: 0; }
  #status { font-weight: 600; }
  #note { color: var(--warn); font-size: 13px; min-height: 1.2em; }
  .tray { display: flex; gap: 3px; align-items: center; padding: 4px 8px; min-height: 28px; min-width: 60px; border-radius: 14px; background: #0a0e10; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  /* Portrait: the table turns vertical and the controls sit in a row beneath it. */
  @media (max-aspect-ratio: 4/5) {
    #game { gap: 4px; --gut: 8px; }
    .hud { gap: 6px; }
    .team { padding: 4px 8px; flex-direction: column; align-items: flex-start; gap: 2px; }
    .team.r { flex-direction: column; align-items: flex-end; }
    .grp, .team.r .grp { align-items: inherit; }
    .glabel { display: none; }
    .scores { gap: 4px; }
    .sc { padding: 3px 6px; column-gap: 4px; }
    .sc .nm { font-size: 12px; }
    .sc b { font-size: 18px; }
    .sc .st8 { font-size: 10px; letter-spacing: 0; }
    .chip { width: 15px; height: 15px; font-size: 8px; }
    .chip i { width: 9px; height: 9px; }
    .arena { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "table table" "hit power"; gap: 6px; }
    .ctl.hit { flex-direction: row; }
    .ctl.hit .label { display: none; }
    #hit { width: 72px; height: 72px; }
    .fine button { min-height: 44px; padding: 4px 10px; }
    .ctl.pow { height: auto; width: 100%; }
    .ctl.pow .label { display: none; }
    #power { width: 100%; height: 56px; min-height: 0; }
    #powerFill { top: 0; bottom: 0; right: auto; height: auto; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, var(--chalk), var(--brass) 60%, var(--bad)); }
    #power::after { content: "pull \2192"; bottom: auto; top: 50%; transform: translateY(-50%); }
    .bottom { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; }
    .bottom .msg { grid-column: 1 / -1; font-size: 14px; }
    .bottom .tray { justify-self: start; }
    .actions { gap: 6px; flex-wrap: nowrap; }
    .actions button, .actions select { min-height: 44px; padding: 4px 10px; }
  }
  @media (max-height: 520px) and (min-aspect-ratio: 4/5) {
    #hit { width: 80px; height: 80px; }
    .ctl .label { display: none; }
    .team { padding: 3px 8px; }
  }
  /* Menu and lobby */
  .screen { height: 100dvh; overflow-y: auto; display: grid; place-items: center; padding: 16px; }
  .card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .brand { margin: 0 0 4px; font-size: 40px; letter-spacing: -.02em; font-weight: 800; }
  .brand span { color: var(--chalk); }
  .brand::after { content: ""; display: block; width: 72px; height: 4px; margin-top: 6px; border-radius: 2px; background: linear-gradient(90deg, var(--chalk), var(--brass)); }
  .tag { margin: 6px 0 18px; color: var(--muted); }
  .field { display: grid; gap: 6px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  input[type=text] { min-height: 44px; padding: 8px 12px; background: #0d1316; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; color: var(--text); }
  #code { text-transform: uppercase; letter-spacing: .2em; font-weight: 700; }
  .opt { border-top: 1px solid var(--line); padding: 14px 0 4px; }
  .opt h2 { margin: 0 0 10px; font-size: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: flex; align-items: center; padding: 9px 12px; min-height: 44px; color: var(--muted); }
  .seg label + label span { border-left: 1px solid var(--line); }
  .seg input:checked + span { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--chalk); }
  .seg input:focus-visible + span { outline: 2px solid var(--chalk); outline-offset: -2px; }
  .grow { flex: 1; }
  .err { color: var(--warn); min-height: 1.3em; margin: 10px 0 0; }
  .lobbyHead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lobbyHead h2 { margin: 0; font-size: 20px; }
  .code { font: 800 26px/1 ui-monospace, Consolas, monospace; letter-spacing: .18em; color: var(--chalk); }
  .teamsGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .teamsGrid.one { grid-template-columns: 1fr; }
  /* Free-for-all seats wrap into two columns where there's room, so 4 players fit a landscape phone. */
  .teamsGrid.one .tcol { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); column-gap: 12px; }
  .teamsGrid.one .tcol h3 { grid-column: 1 / -1; }
  .tcol h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .seat { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: #11181b; }
  .seat.empty { border-style: dashed; color: var(--muted); }
  .seat.me { border-color: var(--chalk); }
  .seat .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: rgba(111,211,154,.4); }
  .badge.host { color: var(--brass); border-color: rgba(217,164,65,.4); }
  .seat button { min-height: 44px; padding: 4px 12px; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,8,10,.55); padding: 16px; z-index: 5; }
  #overlay .card { text-align: center; width: min(420px, 100%); }
  #overlay h2 { margin: 0 0 6px; font-size: 28px; }
  #overlay p { color: var(--muted); margin: 0 0 18px; }
  #banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 6; background: var(--bad); color: #fff; padding: 6px 14px; border-radius: 10px; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="banner" role="alert" hidden>Reconnecting&hellip;</div>
<section id="menu" class="screen">
  <div class="card">
    <h1 class="brand">Chalk<span>line</span></h1>
    <p class="tag">Eight-ball with real ball physics. No account needed.</p>
    <label class="field">Your name <input type="text" id="name" maxlength="20" autocomplete="nickname" placeholder="Player"></label>
    <div class="opt">
      <h2>Play vs Bot</h2>
      <div class="row">
        <div class="seg" role="radiogroup" aria-label="Bot difficulty">
          <label><input type="radio" name="difficulty" value="easy"><span>Easy</span></label>
          <label><input type="radio" name="difficulty" value="medium" checked><span>Medium</span></label>
          <label><input type="radio" name="difficulty" value="hard"><span>Hard</span></label>
        </div>
        <div class="seg" role="radiogroup" aria-label="Mode for the bot game">
          <label><input type="radio" name="botMode" value="assist" checked><span>Assist</span></label>
          <label><input type="radio" name="botMode" value="hard"><span>Hard</span></label>
        </div>
        <button id="playBot" class="primary grow">Play</button>
      </div>
    </div>
    <div class="opt">
      <h2>Create a room</h2>
      <div class="row">
        <div class="seg" role="radiogroup" aria-label="Format">
          <label><input type="radio" name="format" value="1v1" checked><span>1v1</span></label>
          <label><input type="radio" name="format" value="1v2"><span>1v2</span></label>
          <label><input type="radio" name="format" value="2v2"><span>2v2</span></label>
          <label><input type="radio" name="format" value="1v1v1"><span>1v1v1</span></label>
          <label><input type="radio" name="format" value="1v1v1v1"><span>1v1v1v1</span></label>
        </div>
        <div class="seg" role="radiogroup" aria-label="Mode for the room">
          <label><input type="radio" name="roomMode" value="assist" checked><span>Assist</span></label>
          <label><input type="radio" name="roomMode" value="hard"><span>Hard</span></label>
        </div>
        <button id="createRoom" class="primary grow">Create</button>
      </div>
    </div>
    <div class="opt">
      <h2>Join a room</h2>
      <div class="row">
        <input type="text" id="code" class="grow" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Room code">
        <button id="joinRoom" class="primary">Join</button>
      </div>
    </div>
    <p class="err" id="menuNote" role="status"></p>
  </div>
</section>
<section id="lobby" class="screen" hidden>
  <div class="card">
    <div class="lobbyHead">
      <div><h2>Room <span class="code" id="roomCode"></span></h2><div class="tag" id="lobbyInfo" style="margin:4px 0 0"></div></div>
      <button id="copyLink">Copy invite link</button>
    </div>
    <div class="teamsGrid"><div class="tcol" id="lt0"></div><div class="tcol" id="lt1"></div></div>
    <div class="row">
      <button id="readyBtn" class="grow">Ready</button>
      <button id="startBtn" class="primary grow">Start</button>
      <button id="leaveLobby">Leave</button>
    </div>
    <p class="err" id="lobbyNote" role="status"></p>
  </div>
</section>
<section id="game" hidden>
  <header class="hud">
    <div class="team" id="team0"><div class="players"></div><div class="grp"><span class="glabel"></span><div class="chips"></div></div></div>
    <div class="scores" id="scores" aria-label="Scores" hidden></div>
    <div class="turn">
      <div class="clock" id="clock" hidden>
        <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="track" cx="22" cy="22" r="19"/><circle class="arc" id="clockArc" cx="22" cy="22" r="19" stroke-dasharray="119.38" stroke-dashoffset="0"/></svg>
        <b id="clockText" role="timer" aria-label="Shot clock"></b>
      </div>
    </div>
    <div class="team r" id="team1"><div class="players"></div><div class="grp"><span class="glabel"></span><div class="chips"></div></div></div>
  </header>
  <div class="arena">
    <div class="ctl hit">
      <div class="label">Spin</div>
      <div id="hit" aria-label="Cue ball hit point. Drag to set spin."><div id="hitLimit"></div><div id="hitDot"></div></div>
      <div class="fine">
        <button id="fineLeft" aria-label="Rotate aim counterclockwise">&#8634;</button>
        <button id="fineRight" aria-label="Rotate aim clockwise">&#8635;</button>
      </div>
    </div>
    <div class="tableWrap"><canvas id="table" aria-label="Pool table. Drag to aim."></canvas></div>
    <div class="ctl pow">
      <div class="label">Power</div>
      <div id="power" role="slider" tabindex="0" aria-label="Shot power. Arrow keys set it, Enter shoots." aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="powerFill"></div></div>
    </div>
  </div>
  <footer class="bottom">
    <div class="msg"><div id="status" role="status"></div><div id="note" role="status"></div></div>
    <div class="tray" id="tray" aria-label="Potted balls"></div>
    <div class="actions">
      <span id="chooseBar" hidden><button id="rerack">Re-rack</button> <button id="playOn" class="primary">Play on</button></span>
      <button id="leaveGame">Leave</button>
    </div>
  </footer>
</section>
<div id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <button id="backToMenu" class="primary">Back to menu</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
